<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cream card background with solid border -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#f5f5f0" stroke="#1a1a1a" stroke-width="6" />
  
  <!-- Red vertical bar on the left -->
  <rect x="28" y="44" width="20" height="50" rx="10" fill="#ff3b30" stroke="#1a1a1a" stroke-width="5" />
  
  <!-- Yellow circle in the center/middle -->
  <circle cx="64" cy="54" r="14" fill="#ffcc00" stroke="#1a1a1a" stroke-width="5" />
  
  <!-- Blue vertical bar on the right -->
  <rect x="80" y="34" width="20" height="60" rx="10" fill="#0055b3" stroke="#1a1a1a" stroke-width="5" />
</svg>
