<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bauhaus-red: #ff3b30;
      --bauhaus-blue: #0055b3;
      --bauhaus-yellow: #ffcc00;
      --color-accent: #0055b3;
      
      --color-bg: #f5f5f0; /* Cream paper background */
      --text-color: #1a1a1a;
      --text-muted: #555555;
    }

    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--color-bg);
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      background-size: 16px 16px; /* Square grid pattern */
      color: var(--text-color);
      padding: 1rem;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .logo-text {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #1a1a1a;
    }

    .container {
      background: #ffffff;
      border: 2px solid #1a1a1a;
      box-shadow: 4px 4px 0px #1a1a1a; /* Offset solid shadow */
      border-radius: 8px;
      padding: 0.85rem;
      text-align: center;
      box-sizing: border-box;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 800;
      margin-top: 0;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      word-break: break-all;
    }

    .btn {
      width: 100%;
      background: var(--color-accent);
      color: #ffffff;
      border: 2px solid #1a1a1a;
      box-shadow: 2px 2px 0px #1a1a1a;
      padding: 0.5rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.1s ease;
      box-sizing: border-box;
      outline: none;
    }

    .btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #1a1a1a;
    }
    
    .btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #1a1a1a;
    }

    .btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      border-color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    .chk-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .chk-label input {
      margin: 0;
      cursor: pointer;
    }

    .status {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      min-height: 1.2rem;
      font-weight: 700;
      text-align: center;
    }

    .status.success {
      color: #16a34a;
    }

    .status.error {
      color: var(--bauhaus-red);
    }

    .status.loading {
      color: var(--color-accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; gap: 2px; align-items: flex-end; margin-right: 0.3rem;">
      <div style="width: 8px; height: 16px; background: var(--bauhaus-red); border-radius: 4px 0 0 4px;"></div>
      <div style="width: 8px; height: 8px; background: var(--bauhaus-yellow); border-radius: 50%;"></div>
      <div style="width: 8px; height: 20px; background: var(--color-accent); border-radius: 0 4px 4px 0;"></div>
    </div>
    <span class="logo-text">GetaJob</span>
  </div>

  <!-- Single Page Import Container -->
  <div class="container" style="margin-bottom: 0.85rem;">
    <h3 class="title" style="margin-bottom: 0.2rem; border-bottom: 2px solid #1a1a1a; padding-bottom: 0.25rem; text-align: left; display: flex; align-items: center; gap: 0.3rem;">
      <span>📌</span> 單一網頁匯入
    </h3>
    <div id="job-info">
      <p class="subtitle" id="page-url" style="margin: 0.2rem 0 0.5rem 0; font-size: 0.75rem; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">偵測中...</p>
    </div>
    <button class="btn" id="scrape-btn" disabled style="padding: 0.4rem; font-size: 0.8rem;">匯入當前頁面</button>
  </div>

  <!-- Automated Platform Crawler Container -->
  <div class="container">
    <h3 class="title" style="margin-bottom: 0.4rem; border-bottom: 2px solid #1a1a1a; padding-bottom: 0.25rem; text-align: left; display: flex; align-items: center; gap: 0.3rem;">
      <span>🤖</span> 全站自動爬蟲
    </h3>
    
    <div id="pref-info" style="text-align: left; font-size: 0.72rem; background: #f0f0eb; border: 1.5px solid #1a1a1a; padding: 0.4rem; margin-bottom: 0.5rem; border-radius: 4px; line-height: 1.3;">
      <b>已同步求職偏好：</b><br/>
      <span id="pref-details" style="color: var(--text-muted); font-weight: 600;">正在從網頁端同步...</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 0.2rem; text-align: left; margin-bottom: 0.6rem;">
      <label class="chk-label"><input type="checkbox" id="chk-104" checked> 104 人力銀行</label>
      <label class="chk-label"><input type="checkbox" id="chk-cake" checked> Cake</label>
      <label class="chk-label"><input type="checkbox" id="chk-linkedin"> LinkedIn</label>
      <label class="chk-label"><input type="checkbox" id="chk-1111" checked> 1111 人力銀行</label>
    </div>

    <div style="display: flex; gap: 0.4rem; margin-bottom: 0.5rem;">
      <button class="btn" id="crawl-start-btn" style="flex: 1.2; padding: 0.45rem; font-size: 0.8rem; background: var(--color-accent);">開始爬取</button>
      <button class="btn" id="crawl-stop-btn" disabled style="flex: 0.8; padding: 0.45rem; font-size: 0.8rem; background: var(--bauhaus-red);">停止</button>
    </div>

    <div id="crawl-log" style="text-align: left; font-family: monospace; font-size: 0.7rem; background: #1a1a1a; color: #4ade80; border: 2px solid #1a1a1a; border-radius: 4px; padding: 0.45rem; height: 95px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.25;">歡迎使用 GetaJob 爬蟲...</div>
  </div>
  
  <div class="status" id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
